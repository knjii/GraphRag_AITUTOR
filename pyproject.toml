[project]
name = "rag-textbook"
version = "0.2.0"
description = "RAG-ассистент для глубокого изучения математической и технической литературы с графом знаний"
requires-python = ">=3.11,<3.13"
readme = "README.md"

# Версии согласованы между собой: весь стек LangChain на ветке 1.x,
# чтобы исключить конфликт langchain-core 0.2.x против интеграций 1.x.
dependencies = [
    # конфигурация и утилиты
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    # Мониторинг ресурсов: процессор, память, дисковый ввод-вывод.
    # Состояние видеокарты снимается через nvidia-smi, отдельной зависимости не требует.
    "psutil>=6.0",

    # LangChain: только примитивы, без legacy-цепочек
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",

    # хранилища
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "neo4j>=5.23",

    # морфология русского языка для лексического канала и канонизации сущностей
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",

    # трейсинг
    "arize-phoenix-otel>=0.14",
    "openinference-instrumentation>=0.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",

    # сервис
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Парсинг PDF. Ставится только там, где реально парсим (арендованный GPU-сервер).
# Именно extra `core`: голый `mineru` — это лишь оболочка без моделей и без
# PyTorch, разбор с ним не запустится.
parsing = [
    "mineru[core]>=2.0",
]
# Локальные модели без внешнего сервера инференса.
local-models = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]
# Интерфейс для демонстрации.
ui = [
    "streamlit>=1.38",
]
# Генеративные метрики. Держим отдельно: тянет тяжёлое дерево зависимостей.
eval-llm = [
    "deepeval>=3.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
rag-ingest = "rag_textbook.cli.main:ingest_app"
rag-query = "rag_textbook.cli.main:query_app"
rag-eval = "rag_textbook.cli.main:eval_app"
rag-textbook = "rag_textbook.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_textbook"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
